name: ROS2 Kilted CI

on:
  push:
    branches:
      - main
      - master
      - 'copilot/**'
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    env:
      ROS_DISTRO: kilted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup ROS 2 Kilted
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ env.ROS_DISTRO }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          rosdep update
          rosdep install --from-paths . --ignore-src -r -y

      - name: Build
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          colcon build --event-handlers console_direct+ --packages-select seeed_usb_can_analyzer_driver

      - name: Test
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ --packages-select seeed_usb_can_analyzer_driver
          colcon test-result --verbose
